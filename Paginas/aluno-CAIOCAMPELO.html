<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Meu Hobby Favorito: Ouvir música</title>
    <link rel="icon" href="caio.png">
    <style>
        /* Fundo da página em lavanda e texto em azul escuro */
        body {
            background-color: #E6E6FA; /* Lavanda */
            color: #191970; /* Azul meia-noite */
            text-align: center;
            padding: 20px;
            font-family: sans-serif;
        }

        /* Caixa centralizada branca para o álbum */
        .cartao-musica {
            background-color: #FFFFFF;
            border: 3px solid #B57EDC; /* Lilás */
            border-radius: 12px; /* Bordas levemente arredondadas */
            padding: 20px;
            width: 320px;
            margin: 20px auto;
            box-shadow: 0 4px 10px rgba(181, 126, 220, 0.3);
        }

        /* Tamanho e borda da imagem do álbum */
        img {
            width: 220px;
            height: 220px;
            border: 2px solid #8A2BE2; /* Azul violeta */
            border-radius: 4px;
            object-fit: cover;
        }

        /* Estilo da citação */
        blockquote {
            color: #6A5ACD; /* Azul ardósia médio */
            font-style: italic;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <h1>Mergulhando na Música</h1>
    
    <p>Ouvir música eletrônica é o meu momento favorito do dia!</p>

    <div class="cartao-musica">
        <h2>Um Álbum Essencial</h2>
        <h3>Vespertine - Björk</h3>
        
        <!-- Foto da capa do álbum -->
        <img src="vespertine.jpg.jpeg" alt="Capa do álbum Homogenic da Björk">

        <blockquote>
            "It's not meant to be a strife, it's not meant to be a struggle uphill..."
        </blockquote>
    </div>

</body>
</html>
