<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Meu Hobby Favorito: Leitura</title>
    <link rel="icon" href="https://png.pngtree.com/png-vector/20240124/ourmid/pngtree-pink-butterfly-watercolor-butterfly-butterfly-illustration-cute-butterfly-png-image_11474681.png">
    <style>
        /* Fundo da página em azul claro */ 
        /*texto em azul escuro */
        body {
            background-color: #e6f0fa;
            color: #0d233a;
            text-align: center;
            padding: 20px;
        }

        /* Caixa centralizada branca para o livro */
        .cartao-livro {
            background-color: #ffffff;
            border: 2px solid #2b5b84;
            padding: 20px;
            width: 300px;
            margin: 20px auto;
        }

        /* Tamanho e a borda da imagem */
        img {
            width: 200px;
            height: 260px;
            border: 1px solid #2b5b84;
        }

        /* Estilo da  citação */
        blockquote {
            color: #3075b1;
            font-style: italic;
        }
    </style>
</head>
<body>

    <h1>Meu Hobby Favorito: Ler Livros</h1>
    
    <p>Ler é o meu hobby favorito do mundo!</p>

    <div class="cartao-livro">
        <h2>Meu Livro Favorito</h2>
        <h3>A Sociedade Cinderela</h3>
        
        <!-- Foto da capa do livro -->
        <img src="https://m.media-amazon.com/images/I/41xgTtwTdbL._SY342_.jpg" alt="Capa do livro A Sociedade Cinderela">

        <blockquote>
            "— Está pronta para brincar de cinderela?"
        </blockquote>
    </div>

</body>
</html>
